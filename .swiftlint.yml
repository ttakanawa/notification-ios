opt_in_rules:
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - force_unwrapping
  - unhandled_throwing_task
  - unowned_variable_capture

# Not enabled: async_without_await cannot distinguish async protocol witnesses,
# which account for most findings in this protocol-heavy codebase.
# Not enabled: incompatible_concurrency_annotation enforces @preconcurrency for
# Swift 5 source compatibility, while this package intentionally requires Swift 6.

excluded:
  - .build
  - .swiftpm
  - .worktrees
  - DerivedData

# The default structural rules stay enabled, with limits calibrated to this
# protocol-heavy app and its colocated behavioral test suites. Switch cases are
# exhaustive domain dispatch, not independent decision branches.
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

file_length:
  warning: 2200
  error: 2500
  ignore_comment_only_lines: true

function_body_length:
  warning: 200
  error: 300

function_parameter_count:
  warning: 8
  error: 10
  ignores_default_parameters: true

# Three-field records are concise table-driven fixtures; four fields should be
# promoted to a named type.
large_tuple:
  warning: 3
  error: 4

# Canonical JSON fixtures are intentionally single-line byte-exact documents.
# All executable code and ordinary strings retain the default 120/200 limits.
line_length:
  warning: 120
  error: 200
  excluded_lines_patterns:
    - '#".*"#'

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2
  check_nesting_in_closures_and_statements: true
  always_allow_one_type_in_functions: false
  ignore_typealiases_and_associatedtypes: false
  ignore_coding_keys: true

type_body_length:
  warning: 1250
  error: 1500
  excluded_types:
    - extension
    - protocol

# Swift format places the brace on the next line for multiline declarations
# and conditions. Keep the rule active for all single-line forms.
opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_type_headers: true

# Fixed UUID and time-zone literals are deterministic fixtures, equivalent to
# SwiftLint's built-in allowance for fixed URL literals. Dynamic arguments are
# still reported.
force_unwrapping:
  ignored_literal_argument_functions:
    - Data(hexString:)
    - NSImage(named:)
    - NSURL(string:)
    - UIImage(named:)
    - URL(string:)
    - UUID(uuidString:)
    - TimeZone(identifier:)
